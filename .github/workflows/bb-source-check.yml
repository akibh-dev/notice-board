name: Bangladesh Bank source check

on:
  pull_request:
    paths:
      - 'scripts/bb-erecruitment.ts'
      - 'scripts/check-bb.ts'
      - 'src/sources/bb-erecruitment*'
      - 'src/sources/snapshots/bb-erecruitment.json'
      - 'src/lib/source-fallback*'
      - 'scripts/fetch.ts'
      - '.github/workflows/bb-source-check.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/bb-erecruitment.ts'
      - 'scripts/check-bb.ts'
      - 'src/sources/bb-erecruitment*'
      - 'src/sources/snapshots/bb-erecruitment.json'
      - 'src/lib/source-fallback*'
      - 'scripts/fetch.ts'
      - '.github/workflows/bb-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check
      - name: Fetch and validate Bangladesh Bank notices
        run: bunx tsx scripts/check-bb.ts
      - name: Fetch complete dataset and build site
        run: |
          bun run fetch
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync("data/notices.json", "utf8"));
            const notices = data.notices.filter(n => n.sourceId === "bb-erecruitment");
            const status = data.sources.find(s => s.id === "bb-erecruitment");
            assert(notices.length > 0, "BB notices must survive a blocked live request");
            assert(notices.every(n => n.publishedAt && n.deadline), "BB dates must be populated");
            assert(status.ok || status.stale, "Saved notices must be marked stale");
            console.log(`${notices.length} BB notices in dataset; stale=${status.stale}; captured=${status.fetchedAt}`);
          '
          bun run build
      - name: Save source responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-source-responses
          path: |
            data/bb-debug/
            data/notices.json
          retention-days: 3
