# ==============================================================================
# Notice Board → Cloudflare Pages deployment
# (mirrors akiblog/.github/workflows/portfolio-deploy.yml)
#
# - Trigger: every push to `main`, or a manual run from the Actions tab
#   (workflow_dispatch).
# - Builds IN CI from source with bun, so the deployed site always matches the
#   pushed commit.
# - `bun run fetch` runs scripts/fetch.ts, which pulls every registered source
#   (scripts/teletalk.ts for Teletalk Alljobs — paginates until an empty page,
#   drops expired jobs). A failing source keeps its previous deploy's notices
#   (downloaded from $SITE_URL/notices.json) and is flagged stale; the build
#   only fails if zero notices exist.
# - Deploys with `wrangler pages deploy` from the repo root, uploading the
#   static dist/. `--branch=main` makes it a PRODUCTION deployment.
# - First run: if the Pages project doesn't exist yet, it is created with
#   production branch `main`. After that the step is a no-op.
# - Custom domain: attach `board.akibh.dev` once in the dashboard
#   (Pages → notice-board → Custom domains). The zone is on the same account,
#   so SSL/routing is automatic after that.
# - `concurrency` stops two pushes from racing; the newer deploy wins.
#
# Required GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
# ==============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy notice-board
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://board.akibh.dev
      PROJECT_NAME: notice-board

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Fetch notices (Teletalk Alljobs + other sources)
        run: bun run fetch

      - name: Build site
        run: bun run build

      - name: Ensure Pages project exists
        run: |
          if bunx wrangler pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Pages project '$PROJECT_NAME' exists"
          else
            bunx wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        run: |
          bunx wrangler pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$(git log -1 --pretty=%s | head -c 200)"
