<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="p" width="19.6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(-45)">
      <!-- light theme: 0.4 group opacity — full-strength #d4442a read
           too loud on the cream frame; dark variant uses 0.45 -->
      <g opacity="0.4">
        <!-- circled A -->
        <circle cx="1.1" cy="3" r="0.95" fill="none" stroke="#d4442a" stroke-width="0.18"/>
        <text x="1.1" y="3.46" text-anchor="middle" font-size="1.3" font-weight="600"
              font-family="'IBM Plex Mono', ui-monospace, monospace"
              fill="#d4442a">A</text>
        <!-- name -->
        <text x="2.85" y="3.7" font-size="2" textLength="15.6" lengthAdjust="spacing"
              font-family="'IBM Plex Mono', ui-monospace, monospace"
              fill="#d4442a">Md Akib Hasan</text>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#p)"/>
</svg>
